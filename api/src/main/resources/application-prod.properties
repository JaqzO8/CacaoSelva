# En producción se requiere PostgreSQL externo; no se crea una base local.
spring.datasource.url=${CACAOSELVA_DB_URL}
spring.datasource.username=${CACAOSELVA_DB_USER}
spring.datasource.password=${CACAOSELVA_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=0
cacaoselva.security.enabled=true
server.forward-headers-strategy=native
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
