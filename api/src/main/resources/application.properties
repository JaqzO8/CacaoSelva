spring.application.name=cacaoselva-api
server.port=${PORT:5080}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.config.import=optional:file:./.env.local[.properties]
spring.datasource.url=${CACAOSELVA_DB_URL:jdbc:postgresql://localhost:5432/cacaoselva}
spring.datasource.username=${CACAOSELVA_DB_USER:postgres}
spring.datasource.password=${CACAOSELVA_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=3000
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.schemas=cacaoselva
spring.flyway.default-schema=cacaoselva
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
cacaoselva.security.enabled=${CACAOSELVA_SECURITY_ENABLED:true}
cacaoselva.jwt.secret=${CACAOSELVA_JWT_SECRET:}
cacaoselva.admin.password=${CACAOSELVA_ADMIN_PASSWORD:}
cacaoselva.registration.enabled=${CACAOSELVA_REGISTRATION_ENABLED:true}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=CacaoSelva API
info.app.version=@project.version@
info.app.java=${java.version}
info.app.commit=${RENDER_GIT_COMMIT:${CACAOSELVA_BUILD_SHA:local}}
