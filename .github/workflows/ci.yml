name: Pruebas CacaoSelva
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar PostgreSQL, JavaFX y Newman
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17 libgtk-3-0 xvfb
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          npm install --global newman@6.2.1
      - name: Pruebas unitarias, integración, UI y procesos reales
        run: xvfb-run -a pwsh -NoProfile -File scripts/verify.ps1 -Gui -Postman
      - name: Reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            desktop/target/javafx-smoke.png
            .tools/validation/
          include-hidden-files: true
